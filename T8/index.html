<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6 font-['Plus_Jakarta_Sans',sans-serif]">

  <main class="w-full max-w-md mx-auto">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">
      
      <div class="text-center">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Expense Tracker</h1>
        <p class="text-xs text-slate-500 mt-1">Track and manage your daily spending</p>
      </div>

      <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 text-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Spent</span>
        <div id="total-amount" class="text-3xl font-extrabold text-slate-900 mt-0.5">$0.00</div>
      </div>

      <form id="expense-form" class="space-y-3">
        <div>
          <input type="text" id="expense-title" placeholder="Expense description" required class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
        </div>
        <div class="flex gap-2">
          <input type="number" id="expense-amount" placeholder="Amount ($)" min="0.01" step="any" required class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-sm font-semibold rounded-lg shadow-sm transition whitespace-nowrap">Add</button>
        </div>
      </form>

      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-500 px-1">
          <span>Recent Expenses</span>
          <span id="expense-count">0 items</span>
        </div>
        <ul id="expense-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto"></ul>
        <p id="empty-state" class="text-center py-6 text-xs text-slate-400">No expenses recorded yet</p>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
