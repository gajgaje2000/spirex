<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="page-container">
    <div class="clock-card">
      <div class="clock-display" aria-live="polite">
        <span class="time-digit" id="hours">00</span>
        <span class="time-separator">:</span>
        <span class="time-digit" id="minutes">00</span>
        <span class="time-separator">:</span>
        <span class="time-digit" id="seconds">00</span>
        <span class="time-ampm" id="ampm">AM</span>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
