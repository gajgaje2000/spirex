<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Hospital | Doctors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-['Plus_Jakarta_Sans',sans-serif]">

  <!-- Shared Top Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-2.5 font-bold text-slate-900 text-sm sm:text-base">
        <span>City <span class="text-blue-600">Hospital</span></span>
      </a>

      <nav class="hidden md:flex items-center gap-1 text-xs font-semibold">
        <a href="index.html" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Home</a>
        <a href="services.html" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Services</a>
        <a href="doctors.html" class="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700">Doctors</a>
        <a href="appointment.html" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Book Appointment</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="appointment.html" class="hidden sm:inline-flex px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">
          Book Visit
        </a>
        <button id="mobile-menu-btn" type="button" aria-label="Toggle Navigation" class="md:hidden p-2 text-slate-600 hover:text-slate-900 rounded-lg border border-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 px-4 py-3 space-y-1 bg-white text-xs font-semibold text-slate-600">
      <a href="index.html" class="block px-3 py-2 rounded-lg hover:bg-slate-50">Home</a>
      <a href="services.html" class="block px-3 py-2 rounded-lg hover:bg-slate-50">Services</a>
      <a href="doctors.html" class="block px-3 py-2 rounded-lg bg-blue-50 text-blue-700">Doctors</a>
      <a href="appointment.html" class="block px-3 py-2 rounded-lg hover:bg-slate-50">Book Appointment</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-8">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Available Doctors</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Select a doctor to book your consultation appointment</p>
      </div>

      <!-- Department Filter Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0" id="filter-container">
        <button type="button" data-filter="All" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white transition whitespace-nowrap">All</button>
        <button type="button" data-filter="Cardiology" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition whitespace-nowrap">Cardiology</button>
        <button type="button" data-filter="Orthopedics" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition whitespace-nowrap">Orthopedics</button>
        <button type="button" data-filter="Pediatrics" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition whitespace-nowrap">Pediatrics</button>
        <button type="button" data-filter="General Medicine" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition whitespace-nowrap">General</button>
        <button type="button" data-filter="Neurology" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition whitespace-nowrap">Neurology</button>
        <button type="button" data-filter="Dermatology" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition whitespace-nowrap">Dermatology</button>
      </div>
    </div>

    <!-- Doctors Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="doctors-grid">
      <!-- Rendered by app.js -->
    </div>

  </main>

  <!-- Shared Minimal Footer -->
  <footer class="bg-white border-t border-slate-200 mt-16 py-6 text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-900">City Hospital</span>
        <span>• Doctors Directory</span>
      </div>
      <div class="flex gap-4">
        <a href="index.html" class="hover:text-slate-900 transition">Home</a>
        <a href="services.html" class="hover:text-slate-900 transition">Services</a>
        <a href="doctors.html" class="hover:text-slate-900 transition">Doctors</a>
        <a href="appointment.html" class="hover:text-slate-900 transition">Book Appointment</a>
      </div>
      <p>&copy; 2026 City Hospital. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
