<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Information App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6 font-['Plus_Jakarta_Sans',sans-serif]">

  <main class="w-full max-w-lg mx-auto">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">

      <div class="text-center">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Country Information</h1>
        <p class="text-xs text-slate-500 mt-1">Search country details, flags, and demographics</p>
      </div>

      <form id="search-form" class="space-y-3">
        <div class="flex gap-2">
          <input type="text" id="search-input" placeholder="Enter country name (e.g. India, Japan)" required class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
          <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-sm font-semibold rounded-lg shadow-sm transition whitespace-nowrap">Search</button>
        </div>
      </form>

      <div id="status-message" class="hidden text-center py-6 text-xs text-slate-500"></div>

      <div id="country-card" class="space-y-5 border-t border-slate-100 pt-5">
        <div class="flex items-center gap-4">
          <img id="country-flag" src="" alt="Flag" class="w-20 h-14 object-cover rounded-md border border-slate-200 shadow-sm flex-shrink-0">
          <div>
            <h2 id="country-name" class="text-xl font-bold text-slate-900 leading-tight"></h2>
            <p id="country-official" class="text-xs text-slate-500 mt-0.5 line-clamp-1"></p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 text-xs">
          <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-3">
            <span class="text-slate-400 font-semibold uppercase tracking-wider block text-[10px]">Capital</span>
            <span id="country-capital" class="text-slate-800 font-bold text-sm mt-0.5 block truncate"></span>
          </div>

          <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-3">
            <span class="text-slate-400 font-semibold uppercase tracking-wider block text-[10px]">Population</span>
            <span id="country-population" class="text-slate-800 font-bold text-sm mt-0.5 block truncate"></span>
          </div>

          <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-3">
            <span class="text-slate-400 font-semibold uppercase tracking-wider block text-[10px]">Region</span>
            <span id="country-region" class="text-slate-800 font-bold text-sm mt-0.5 block truncate"></span>
          </div>

          <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-3">
            <span class="text-slate-400 font-semibold uppercase tracking-wider block text-[10px]">Currency</span>
            <span id="country-currency" class="text-slate-800 font-bold text-sm mt-0.5 block truncate"></span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
